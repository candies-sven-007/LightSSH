name: Build Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Package
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          npx @electron/packager . LightSSH --platform=win32 --arch=x64 --out=dist --overwrite --asar `
            --icon=build_icon.ico --app-version=$v --build-version="$v.0" --app-copyright="Candies Sven" `
            --win32metadata.CompanyName="Candies Sven" --win32metadata.FileDescription=LightSSH --win32metadata.ProductName=LightSSH `
            --ignore="^/dist" --ignore="^/docs" --ignore="^/\.github" --ignore="^/README" --ignore="^/build_icon.ico$"
          $d = "dist/LightSSH-win32-x64"
          Get-ChildItem "$d/locales" | Where-Object { $_.Name -notin @('en-US.pak','zh-CN.pak','zh-TW.pak') } | Remove-Item
          Copy-Item README.txt "$d/使用说明-README.txt"
          Compress-Archive -Path $d -DestinationPath "dist/LightSSH-win32-x64-v$v.zip"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.zip
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: LightSSH-win32-x64
          path: dist/*.zip
